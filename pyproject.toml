[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medprep"
version = "0.1.0"
description = "Medical image preprocessing: DICOM discovery/conversion, resampling, QC primitives, 3D->2D projections"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bruno Schenberg" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
dependencies = [
    "pydicom>=2.4",
    "pandas>=2.0",
    "nibabel>=5.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.urls]
Homepage = "https://github.com/bruno-schenberg/medprep"
Repository = "https://github.com/bruno-schenberg/medprep"
Issues = "https://github.com/bruno-schenberg/medprep/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed for nifti_convert.load_dicom_series_as_array (DICOM series -> NIfTI).
convert = ["monai>=1.3", "itk>=5.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["medprep*"]
